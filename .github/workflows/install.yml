name: Install

on:
  push:
    branches:
      - master

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run deploy script
        run: doctl apps create --project-id 4dfa384f-7eb2-4e58-956e-5669bd432e7a --spec deploy.yaml --wait

      - name: Cleanup
        run: doctl apps delete $(doctl apps list | grep amish | awk '{ print $1 }') --force
