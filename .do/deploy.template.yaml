spec:
  name: amish
  region: sfo
  services:
    - name: guacamole
      github:
        repo: unitehenry/amish
        branch: main
        deploy_on_push: true
      dockerfile_path: images/guacamole/Containerfile
      http_port: 8080
      instance_size_slug: apps-s-1vcpu-1gb
      instance_count: 1
      envs:
        - key: GUACD_HOSTNAME
          value: guacd
          scope: RUN_TIME
        - key: USERNAME
          value: admin
          scope: RUN_TIME
        - key: PASSWORD
          value: password
          scope: RUN_TIME
  
    - name: agent-browser-mcp
      github:
        repo: unitehenry/agent-browser-mcp
        branch: master
      dockerfile_path: Containerfile
      http_port: 8000
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      envs:
        - key: MCP_TRANSPORT
          value: sse
          scope: RUN_TIME
        - key: REDIRECT_URL
          value: /guacamole
          scope: RUN_TIME
        - key: CDP_PORT
          value: http://xpod-chromium:9222
          scope: RUN_TIME
        - key: GITHUB_CLIENT_ID
          value: ""
          scope: RUN_TIME
        - key: GITHUB_CLIENT_SECRET
          value: ""
          scope: RUN_TIME
          type: SECRET
        - key: GITHUB_USERNAME
          value: ""
          scope: RUN_TIME
        - key: BASE_URL
          value: https://your-app.ondigitalocean.app
          scope: RUN_TIME
  
    - name: guacd
      image:
        registry_type: DOCKER_HUB
        registry: guacamole
        repository: guacd
        tag: latest
      internal_ports:
        - 4822
      instance_size_slug: apps-s-2vcpu-4gb
      instance_count: 1
  
    - name: xpod-chromium
      image:
        registry_type: GHCR
        registry: unitehenry
        repository: xpod-chromium
        tag: latest
      internal_ports:
        - 5900
        - 9222
      instance_size_slug: apps-s-4vcpu-8gb
      instance_count: 1
  ingress:
    rules:
      - match:
          path:
            prefix: /guacamole
        component:
          name: guacamole
          preserve_path_prefix: true
  
      - match:
          path:
            prefix: /
        component:
          name: agent-browser-mcp
